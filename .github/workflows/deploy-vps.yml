name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-vps-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Deploy latest main to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${VPS_HOST:?Add VPS_HOST to GitHub Actions secrets}"
          : "${VPS_USER:?Add VPS_USER to GitHub Actions secrets}"
          : "${VPS_SSH_PRIVATE_KEY:?Add VPS_SSH_PRIVATE_KEY to GitHub Actions secrets}"
          : "${VPS_KNOWN_HOSTS:?Add VPS_KNOWN_HOSTS to GitHub Actions secrets}"

          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -i "$HOME/.ssh/id_ed25519" \
            "$VPS_USER@$VPS_HOST" \
            'cd /var/www/chungsuclienquan && git pull --ff-only origin main && npm ci --omit=dev && pm2 restart chungsuclienquan'
